name: Build & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            platform: linux
            arch_flags: "--x64 --arm64"
          - os: windows-latest
            platform: win
            arch_flags: "--x64 --arm64"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Prepare package.json
        run: |
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = '1.0.0';
          pkg.description = 'Launcher application';
          pkg.author = 'mineheal';
          pkg.main = 'electron/main.cjs';
          pkg.name = 'launcher';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Install dependencies
        run: npm ci || npm install

      # electron не прописан в package.json (по README ставится вручную) —
      # без этого шага electron-builder не может определить версию Electron.
      - name: Install Electron
        run: npm install --no-save electron@28.3.3

      - name: Build frontend
        run: npm run build

      # Версия electron-builder закреплена (24.13.3, как в README) —
      # у последней 26.x на Windows/pwsh ломается разбор "-c.publish=never",
      # поэтому используем длинный флаг --publish never.
      - name: Build Electron app
        run: npx electron-builder@24.13.3 --config electron-builder.yml --${{ matrix.platform }} ${{ matrix.arch_flags }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ВАЖНО: electron-builder кладёт готовые инсталляторы в release/,
      # а не в dist/ (dist/ — это только собранный веб-интерфейс).
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-build
          path: release/*
          retention-days: 30

  release:
    needs: build-and-release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      # Тег launcher_1.1 фиксированный — чтобы каждый прогон полностью
      # пересобирал релиз на актуальном коммите, старый релиз+тег сносим.
      - name: Remove previous launcher_1.1 (if exists)
        run: gh release delete launcher_1.1 --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher_1.1
          name: "MineHeal Launcher - release 1.1"
          body: |
            ## Сборка релиза

            - Windows: NSIS и Portable версии (x64, arm64)
            - Linux: AppImage, deb, rpm (x64 и arm64)

            Автоматическая сборка через GitHub Actions
          files: |
            ./artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
