name: Build & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64+arm64
          - os: windows-latest
            platform: win
            arch: x64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Prepare package.json
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '1.0.0';
            pkg.description = 'Launcher application';
            pkg.author = 'mineheal';
            pkg.main = 'electron/main.cjs';
            pkg.name = 'launcher';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Snapcraft (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        uses: samuelmeuli/action-snapcraft@v2
        with:
          use-lxd: true

      - name: Build Electron app
        run: npx electron-builder --config electron-builder.yml --${{ matrix.platform }} --${{ matrix.arch }} -c.publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-build
          path: dist/**
          retention-days: 30

  release:
    needs: build-and-release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 1.0
          name: "Релиз 1.0"
          body: |
            ## Сборка релиза
            - Windows: NSIS и Portable версии
            - Linux: AppImage, deb, rpm (x64 и arm64)
            
            Автоматическая сборка через GitHub Actions
          files: |
            ./artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
