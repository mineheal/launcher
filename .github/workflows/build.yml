# ═══════════════════════════════════════════════════════════════
# MineHeal Launcher — автосборка и публикация в Release с тегом 1.0
#
# Срабатывает при:
#   git tag 1.0 && git push origin 1.0
# либо вручную (Actions → Build & Release → Run workflow).
#
# Артефакты:
#   Windows x64 : MineHeal-Setup-1.0.0-x64.exe (NSIS) + Portable
#   Linux  x64  : AppImage / deb / rpm
#   Linux  arm64: AppImage / deb / rpm
# Минимальные ОС: Windows 10 / 11 (x64), современные дистро Linux.
# ═══════════════════════════════════════════════════════════════
name: Build & Release

on:
  push:
    tags:
      - "1.0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64 (NSIS + Portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci
          npm install --save-dev electron@28.3.3 electron-builder@24.13.3

      - name: Build renderer (Vite)
        run: npx vite build

      - name: Package Windows x64
        run: npx electron-builder --config electron-builder.yml --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Release 1.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "1.0"
          name: "MineHeal Launcher 1.0"
          body: |
            Официальный лаунчер сервера **MineHeal** (Forge 1.12.2).

            **Windows (10/11, x64):**
            - `MineHeal-Setup-…-x64.exe` — установщик (NSIS)
            - `MineHeal-…-x64-Portable.exe` — портативная версия без установки

            **Linux (x64 / arm64):** AppImage, deb, rpm — в файлах релиза.

            Игра ставится в `%APPDATA%\.mineheal` и не трогает обычный Minecraft.
          generate_release_notes: false
          make_latest: true
          files: |
            release/*.exe

  linux:
    name: Linux x64 + arm64 (AppImage/deb/rpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm ci
          npm install --save-dev electron@28.3.3 electron-builder@24.13.3

      - name: Build renderer (Vite)
        run: npx vite build

      - name: Package Linux x64 + arm64
        run: npx electron-builder --config electron-builder.yml --linux --x64 --arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Release 1.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "1.0"
          name: "MineHeal Launcher 1.0"
          make_latest: true
          files: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
