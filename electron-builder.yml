# MineHeal Launcher — конфигурация сборки (electron-builder)
# main подтягивается через extraMetadata, чтобы не трогать package.json
appId: ru.mineheal.launcher
productName: MineHeal
copyright: Copyright © 2026 MineHeal

directories:
  output: release
  buildResources: build

files:
  - dist/**
  - electron/**
  - package.json

extraMetadata:
  main: electron/main.cjs

asar: true
compression: maximum

# ── Windows 10/11, только x64 ──
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: MineHeal-Setup-${version}-${arch}.${ext}

portable:
  artifactName: MineHeal-${version}-${arch}-Portable.${ext}

# ── Linux: x64 + arm64 (AppImage, deb, rpm) ──
linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
    - target: rpm
      arch:
        - x64
        - arm64
  category: Game
  maintainer: mineheal
  artifactName: MineHeal-${version}-${arch}.${ext}
